# Model Configuration
# Controls forecasting model parameters and selection

forecast:
  # Forecast horizon (weeks ahead)
  horizon: 12
  
  # Frequency (W=Weekly, D=Daily, M=Monthly)
  frequency: "W"
  
  # Confidence level for prediction intervals
  confidence_level: 0.95  # 95% → P2.5/P50/P97.5 ≈ P10/P50/P90

validation:
  # Rolling-origin backtesting
  method: "rolling_origin"
  
  # Number of folds
  num_folds: 5
  
  # Minimum training history (weeks)
  min_train_weeks: 26
  
  # Test period (weeks) per fold
  test_weeks: 4
  
  # Primary evaluation metric
  primary_metric: "WAPE"  # Weighted Absolute Percentage Error
  
  # Secondary metrics
  secondary_metrics:
    - "RMSE"
    - "sMAPE"
    - "MASE"
    - "MAE"
    - "Bias"

models:
  # Baseline models (mandatory)
  baseline:
    enabled: true
    include:
      - naive
      - seasonal_naive
      - moving_average
      - exponential_smoothing
  
  # Statistical models
  statistical:
    enabled: true
    arima:
      enabled: true
      # Auto-select order (p,d,q) if None
      order: null  # [1, 1, 1] for fixed
      seasonal_order: null  # [0, 1, 1, 12] for fixed with 12-week seasonality
      auto_arima: true
      stepwise: true
      max_order: 5
    
    sarima:
      enabled: true
      order: [1, 1, 1]
      seasonal_order: [0, 1, 1, 12]  # 12-week seasonality
      auto_arima: false  # Use fixed for consistency
    
    ets:
      enabled: true
      error: "add"
      trend: "add"
      seasonal: "add"
      seasonal_periods: 12
  
  # Intermittent demand models
  intermittent:
    enabled: true
    croston:
      enabled: true
      smoothing_level: 0.1
    
    sba:
      enabled: true
      smoothing_level: 0.1
    
    tsb:
      enabled: true
      smoothing_level: 0.1
  
  # Machine learning models
  ml:
    enabled: true
    
    random_forest:
      enabled: true
      n_estimators: 100
      max_depth: 15
      min_samples_split: 5
      min_samples_leaf: 2
      random_state: 42
    
    gradient_boosting:
      enabled: true
      n_estimators: 100
      learning_rate: 0.1
      max_depth: 5
      min_samples_split: 5
      min_samples_leaf: 2
      random_state: 42
    
    xgboost:
      enabled: true
      n_estimators: 100
      max_depth: 5
      learning_rate: 0.1
      subsample: 0.8
      random_state: 42
    
    lightgbm:
      enabled: true
      n_estimators: 100
      max_depth: 5
      learning_rate: 0.1
      num_leaves: 31
      random_state: 42

# Model selection strategy
model_selection:
  # Strategy: "best" (select single best) or "ensemble" (weighted average)
  strategy: "best"
  
  # How to select champion model
  selection_criterion: "min_WAPE_across_folds"
  
  # Ensemble methods (if strategy="ensemble")
  ensemble:
    method: "weighted_average"  # "simple_average", "weighted_average", "voting"
    # Weights by metric performance (auto-normalized)
    weight_metric: "WAPE"  # Lower is better
    diversity_bonus: 0.1  # Bonus for model diversity (0-1)

# Demand classification (automatic model candidate selection)
demand_classification:
  enabled: true
  
  # Thresholds
  zero_demand_threshold: 0.3  # >30% zero demand = intermittent
  cv_threshold: 0.5  # CV > 0.5 = high variability
  seasonal_strength_threshold: 0.5  # > 0.5 = seasonal
  trend_strength_threshold: 0.2  # > 0.2 = trending

# Feature engineering
features:
  # Lag features
  lags: [1, 2, 3, 4, 8, 12, 13, 26, 52]
  
  # Rolling window features
  rolling_windows: [4, 8, 12]
  rolling_stats: ["mean", "std", "min", "max"]
  
  # Trend features
  trend_windows: [4, 12, 26]
  
  # Calendar features
  calendar_features: true
  
  # Seasonal indicators (one-hot for month/quarter)
  seasonal_features: true
  
  # Business attributes
  business_features: true  # segment, star_rating, material_group

# Probabilistic forecasting
probabilistic:
  enabled: true
  
  # Method: "quantile", "conformal", "parametric"
  method: "quantile"
  
  # Percentiles for prediction intervals
  percentiles: [0.1, 0.5, 0.9]  # P10, P50, P90
  
  # For conformal prediction (if method="conformal")
  conformal:
    coverage_level: 0.9  # 90% coverage
    nonconformity_score: "quantile"
